<!doctype html>
<html lang="id">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>DKI ERP — Orders</title>
		<link
			rel="preconnect"
			href="https://fonts.googleapis.com"
		/>
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&display=swap"
			rel="stylesheet"
		/>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
		<link
			rel="stylesheet"
			href="shell.css"
		/>
		<script src="auth.js"></script>
		<script src="api.js"></script>
		<script src="catalog.js"></script>
		<script src="builder.js"></script>
	</head>
	<body>
		<!-- ====================== SIDEBAR ====================== -->
		<aside class="sidebar" id="sidebar">
			<div class="sidebar-logo">
				<img
					class="logo-img"
					src="assets/Logo_DKI.png"
					alt="PT Duta Kencana Indah"
				/>
			</div>

			<nav class="nav" id="nav"></nav>

			<div class="sidebar-bottom">
				<div class="user-row">
					<div class="avatar">R</div>
					<div class="user-meta">
						<div class="nm">Rayvin</div>
						<div class="rl">
							Superadmin
						</div>
					</div>
				</div>
				<a
					class="logout-row"
					href="index.html"
					title="Log Out"
				>
					<svg
						class="ic"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
					>
						<path
							d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"
						/>
						<polyline
							points="16 17 21 12 16 7"
						/>
						<line
							x1="21"
							y1="12"
							x2="9"
							y2="12"
						/>
					</svg>
					<span class="label"
						>LOG OUT</span
					>
				</a>
			</div>
		</aside>

		<!-- ====================== HEADER ====================== -->
		<header class="header">
			<button
				class="collapse-toggle"
				id="collapseToggle"
			>
				«
			</button>
			<div
				class="breadcrumb"
				id="breadcrumb"
			></div>
			<div class="company">
				PT. DUTA KENCANA INDAH
			</div>
		</header>

		<!-- ====================== MAIN ====================== -->
		<main class="main">
			<div class="welcome">
				<div>
					<h1>Orders</h1>
					<div class="date">
						05 Jun 2026
					</div>
				</div>
				<div class="role">
					Superadmin
				</div>
			</div>

			<div class="export-row">
				<button
					class="btn-export"
					onclick="
						Builder.open('order')
					"
				>
					+ Buat Order
				</button>
				<button class="btn-export">
					Export
				</button>
				<button class="btn-excel">
					Excel
				</button>
			</div>

			<section class="vcard">
				<div class="controls-row">
					<h2 class="vcard-title">
						Orders
					</h2>
					<span class="custom-label"
						>Custom</span
					>
					<div class="daterange">
						<button
							class="date-pill"
							data-target="start"
						>
							05/01
						</button>
						<span class="dash"
							>&mdash;</span
						>
						<button
							class="date-pill"
							data-target="end"
						>
							05/01
						</button>
						<input
							type="date"
							class="date-native"
							id="dateStart"
						/>
						<input
							type="date"
							class="date-native"
							id="dateEnd"
						/>
					</div>
					<div
						class="mw-toggle"
						id="mwToggle"
					>
						<button class="active">
							Monthly</button
						><button>Weekly</button>
					</div>
				</div>

				<div class="filter2-row">
					<div
						class="sp-filter"
						id="spFilter"
					></div>
					<div class="perpage">
						<span class="pp-label"
							>View per page</span
						>
						<button
							class="pp-pill"
							id="perPage"
						>
							10
						</button>
					</div>
				</div>

				<div
					class="summary-row"
					id="summaryRow"
				></div>

				<div
					class="valsummary"
					id="valSummary"
				></div>

				<div
					class="statusfilter"
					id="statusFilter"
				></div>

				<div class="divider"></div>

				<div
					class="visit-table"
					id="orderTable"
				></div>

				<div
					class="pagination"
					id="pagination"
				></div>
			</section>
		</main>

		<style>
			/* ===== export buttons ===== */
			.export-row {
				display: flex;
				justify-content: flex-end;
				gap: 10px;
				margin: -8px 0 16px;
			}
			.btn-export,
			.btn-excel {
				height: 34px;
				padding: 0 20px;
				border: none;
				border-radius: 8px;
				cursor: pointer;
				font-family:
					'Montserrat', sans-serif;
				font-weight: 700;
				font-size: 13px;
				color: #fff;
				transition: filter 0.2s ease;
			}
			.btn-export {
				background: var(--grad);
			}
			.btn-excel {
				background: #27ae60;
			}
			.btn-export:hover,
			.btn-excel:hover {
				filter: brightness(1.08);
			}

			/* ===== main card ===== */
			.vcard {
				background: var(--card);
				border: 1px solid var(--border);
				border-radius: 12px;
				padding: 24px 28px;
				box-shadow: 0 2px 8px
					rgba(0, 0, 0, 0.04);
			}
			.controls-row {
				display: flex;
				align-items: center;
				gap: 16px;
				flex-wrap: wrap;
			}
			.vcard-title {
				margin: 0;
				font-weight: 700;
				font-size: 16px;
				color: var(--text);
			}
			.custom-label {
				font-weight: 500;
				font-size: 14px;
				color: var(--muted);
			}
			.daterange {
				display: flex;
				align-items: center;
				gap: 8px;
				position: relative;
			}
			.date-pill {
				height: 30px;
				padding: 0 14px;
				border: none;
				border-radius: 100px;
				cursor: pointer;
				background: var(--grad);
				color: #fff;
				font-family:
					'Montserrat', sans-serif;
				font-weight: 600;
				font-size: 13px;
			}
			.daterange .dash {
				color: var(--muted);
			}
			.date-native {
				position: absolute;
				left: 0;
				bottom: 0;
				width: 1px;
				height: 1px;
				opacity: 0;
				pointer-events: none;
			}
			.mw-toggle {
				margin-left: auto;
				display: flex;
				gap: 6px;
			}
			.mw-toggle button {
				height: 30px;
				padding: 0 16px;
				border-radius: 100px;
				border: none;
				cursor: pointer;
				font-family:
					'Montserrat', sans-serif;
				font-weight: 600;
				font-size: 13px;
				background: var(--bg);
				color: var(--muted);
				transition: 0.2s;
			}
			.mw-toggle button.active {
				background: var(--grad);
				color: #fff;
			}

			.filter2-row {
				display: flex;
				align-items: center;
				gap: 16px;
				margin-top: 14px;
				flex-wrap: wrap;
			}
			.sp-filter {
				display: flex;
				gap: 8px;
				flex-wrap: wrap;
			}
			.sp-pill {
				display: flex;
				align-items: center;
				gap: 7px;
				height: 30px;
				padding: 0 14px;
				border-radius: 100px;
				cursor: pointer;
				font-family:
					'Montserrat', sans-serif;
				font-weight: 600;
				font-size: 13px;
				background: #fff;
				border: 1px solid var(--border);
				color: var(--muted);
				transition: 0.2s;
				white-space: nowrap;
			}
			.sp-pill .dot {
				width: 7px;
				height: 7px;
				border-radius: 50%;
				background: var(--muted);
				flex: 0 0 auto;
			}
			.sp-pill.active {
				background: var(--grad);
				border-color: transparent;
				color: #fff;
			}
			.sp-pill.active .dot {
				background: #fff;
			}
			.perpage {
				margin-left: auto;
				display: flex;
				align-items: center;
				gap: 10px;
			}
			.pp-label {
				font-weight: 500;
				font-size: 13px;
				color: var(--muted);
			}
			.pp-pill {
				height: 30px;
				padding: 0 14px;
				border: none;
				border-radius: 8px;
				cursor: pointer;
				background: var(--grad);
				color: #fff;
				font-family:
					'Montserrat', sans-serif;
				font-weight: 700;
				font-size: 13px;
			}

			/* salesperson summary cards (Pending) */
			.summary-row {
				display: flex;
				gap: 12px;
				margin-top: 16px;
				margin-bottom: 16px;
				align-items: stretch;
			}
			.sum-card {
				flex: 1 1 0;
				min-width: 0;
				background: #f8fbff;
				border: 1px solid var(--border);
				border-radius: 10px;
				padding: 14px 16px;
				overflow: hidden;
			}
			.sum-top {
				display: flex;
				align-items: center;
				gap: 10px;
				margin-bottom: 10px;
				flex-wrap: wrap;
			}
			.sum-avatar {
				flex: 0 0 40px;
				width: 40px;
				height: 40px;
				border-radius: 50%;
				background: var(--grad);
				display: flex;
				align-items: center;
				justify-content: center;
				color: #fff;
				font-weight: 700;
				font-size: 13px;
			}
			.sum-name {
				font-weight: 600;
				font-size: 14px;
				color: var(--dark);
				white-space: nowrap;
			}
			.sum-stat {
				display: flex;
				align-items: baseline;
				justify-content: space-between;
				gap: 8px;
			}
			.sum-stat .k {
				font-weight: 400;
				font-size: 12px;
				color: var(--muted);
				white-space: nowrap;
			}
			.sum-stat .v {
				font-weight: 700;
				font-size: 16px;
				color: var(--red);
			}

			/* status filter (radio) */
			.statusfilter {
				display: flex;
				gap: 10px;
				margin-bottom: 20px;
				flex-wrap: wrap;
			}
			.sf-pill {
				height: 34px;
				padding: 0 18px;
				border: none;
				border-radius: 100px;
				cursor: pointer;
				font-family:
					'Montserrat', sans-serif;
				font-weight: 600;
				font-size: 13px;
				background: var(--bg);
				color: var(--muted);
				transition:
					background 0.2s ease,
					color 0.2s ease;
			}
			.sf-pill.active {
				color: #fff;
			}
			.sf-pill.active[data-status='all'] {
				background: var(--grad);
			}
			.sf-pill.active[data-status='ongoing'] {
				background: #f5a623;
			}
			.sf-pill.active[data-status='pending'] {
				background: #fe2c23;
			}
			.sf-pill.active[data-status='finished'] {
				background: #27ae60;
			}

			.divider {
				height: 1px;
				background: var(--border);
				width: 100%;
			}

			/* value summary (total / pending / target) */
			.valsummary {
				background: #f8fbff;
				border: 1px solid var(--border);
				border-radius: 12px;
				padding: 18px 22px;
				margin: 16px 0 18px;
			}
			.vs-head {
				display: flex;
				align-items: flex-end;
				justify-content: space-between;
				gap: 16px;
				flex-wrap: wrap;
			}
			.vs-lbl {
				display: block;
				font-weight: 600;
				font-size: 12px;
				color: var(--muted);
				text-transform: uppercase;
				letter-spacing: 0.05em;
				margin-bottom: 5px;
			}
			.vs-amt {
				font-weight: 800;
				font-size: 28px;
				line-height: 1;
			}
			.vs-amt.grad {
				background: var(--grad);
				-webkit-background-clip: text;
				background-clip: text;
				color: transparent;
			}
			.vs-track {
				height: 14px;
				border-radius: 8px;
				background: var(--bg);
				overflow: hidden;
				margin: 16px 0 7px;
			}
			.vs-fill {
				height: 100%;
				border-radius: 8px;
				background: var(--grad);
				transition: width 0.55s ease;
			}
			.vs-cap {
				font-weight: 500;
				font-size: 12px;
				color: var(--muted);
			}
			.vs-cap b {
				font-weight: 800;
				color: var(--dark);
			}
			.vs-subs {
				display: flex;
				gap: 30px;
				margin-top: 14px;
				flex-wrap: wrap;
			}
			.vs-sub {
				display: flex;
				align-items: center;
				gap: 9px;
			}
			.vs-sub .dot {
				width: 9px;
				height: 9px;
				border-radius: 50%;
				flex: 0 0 auto;
			}
			.vs-sub .dot.pend {
				background: #fe2c23;
			}
			.vs-sub .dot.real {
				background: #27ae60;
			}
			.vs-sub .dot.tgt {
				background: var(--dark);
			}
			.vs-sub .k {
				font-weight: 500;
				font-size: 12px;
				color: var(--muted);
			}
			.vs-sub .v {
				font-weight: 700;
				font-size: 15px;
				color: var(--text);
			}

			/* orders table */
			.visit-table {
				margin-top: 4px;
			}
			.v-rowwrap {
				border-bottom: 1px solid #f4f6f9;
			}
			.v-row {
				display: flex;
				align-items: center;
				gap: 16px;
				padding: 12px 8px;
				cursor: pointer;
				transition: background 0.2s ease;
				border-radius: 8px;
			}
			.v-row:hover {
				background: #f8fbff;
			}
			.v-oid {
				font-weight: 700;
				font-size: 14px;
				color: var(--dark);
				min-width: 100px;
			}
			.v-store {
				font-weight: 500;
				font-size: 13px;
				color: var(--text);
				flex: 1;
				min-width: 120px;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			.v-date {
				font-weight: 400;
				font-size: 13px;
				color: var(--muted);
				min-width: 80px;
			}
			.v-delivery {
				font-weight: 400;
				font-size: 13px;
				color: var(--muted);
				min-width: 100px;
			}
			.v-value {
				font-weight: 600;
				font-size: 13px;
				color: var(--text);
				min-width: 100px;
			}
			.v-salesman {
				font-weight: 400;
				font-size: 13px;
				color: var(--muted);
				min-width: 80px;
			}
			.v-status {
				font-weight: 600;
				font-size: 13px;
				min-width: 70px;
			}
			.v-status.ongoing {
				color: #f5a623;
			}
			.v-status.pending {
				color: #fe2c23;
			}
			.v-status.finished {
				color: #27ae60;
			}
			.v-view {
				font-weight: 600;
				font-size: 13px;
				color: var(--blue);
				cursor: pointer;
				min-width: 40px;
				text-align: right;
			}
			.v-view:hover {
				text-decoration: underline;
			}
			.v-rowwrap.open .v-oid,
			.v-rowwrap.open .v-store,
			.v-rowwrap.open .v-view {
				background: var(--grad);
				-webkit-background-clip: text;
				background-clip: text;
				color: transparent;
			}
			@media (max-width: 1320px) {
				.v-delivery {
					display: none;
				}
			}
			@media (max-width: 1120px) {
				.v-date {
					display: none;
				}
			}
			@media (max-width: 960px) {
				.v-salesman {
					display: none;
				}
			}

			/* expanded panel */
			.v-expand {
				overflow: hidden;
				height: 0;
				opacity: 0;
			}
			.v-expand-inner {
				background: #f8fbff;
				border: 1px solid var(--border);
				border-top: none;
				border-radius: 0 0 12px 12px;
				padding: 24px 28px;
				display: flex;
				gap: 32px;
			}
			.v-ex-left {
				flex: 0 0 45%;
			}
			.v-ex-id {
				font-weight: 800;
				font-size: 22px;
				color: var(--dark);
				margin-bottom: 12px;
			}
			.v-ex-store {
				font-weight: 700;
				font-size: 16px;
				color: var(--text);
			}
			.v-ex-addrlabel {
				font-weight: 500;
				font-style: italic;
				font-size: 13px;
				color: var(--muted);
				margin-top: 4px;
			}
			.v-ex-addr {
				font-weight: 400;
				font-size: 13px;
				color: var(--text);
				line-height: 1.6;
				margin-bottom: 16px;
			}
			.v-ex-meta {
				font-weight: 400;
				font-size: 13px;
				color: var(--text);
				line-height: 1.9;
			}
			.v-ex-pill {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				margin-top: 12px;
				padding: 6px 20px;
				border-radius: 100px;
				color: #fff;
				font-weight: 700;
				font-size: 13px;
			}
			.v-ex-pill .pdot {
				width: 8px;
				height: 8px;
				border-radius: 50%;
				background: rgba(0, 0, 0, 0.28);
			}
			.v-ex-pill.ongoing {
				background: #f5a623;
			}
			.v-ex-pill.pending {
				background: #fe2c23;
			}
			.v-ex-pill.finished {
				background: #27ae60;
			}
			.v-ex-substatus {
				display: flex;
				flex-direction: column;
				gap: 2px;
				margin-top: 12px;
			}
			.v-ex-substatus .sk {
				font-weight: 500;
				font-size: 12px;
				color: var(--muted);
				text-transform: uppercase;
				letter-spacing: 0.06em;
			}
			.v-ex-substatus .sv {
				font-weight: 700;
				font-size: 14px;
			}
			.v-ex-substatus .sv.ongoing {
				color: #f5a623;
			}
			.v-ex-substatus .sv.pending {
				color: #fe2c23;
			}
			.v-ex-substatus .sv.finished {
				color: #27ae60;
			}
			.v-ex-right {
				flex: 1;
				min-width: 0;
			}
			.li-row {
				display: flex;
				align-items: flex-start;
				gap: 12px;
				padding: 8px 0;
				border-bottom: 1px solid
					var(--border);
			}
			.li-main {
				flex: 1;
				min-width: 0;
			}
			.li-name {
				font-weight: 600;
				font-size: 14px;
				color: var(--text);
			}
			.li-unit {
				font-weight: 400;
				font-size: 12px;
				color: var(--muted);
				margin-top: 2px;
			}
			.li-qty {
				font-weight: 400;
				font-size: 13px;
				color: var(--muted);
				min-width: 30px;
				text-align: center;
			}
			.li-total {
				font-weight: 600;
				font-size: 14px;
				color: var(--text);
				min-width: 110px;
				text-align: right;
			}
			.li-totalrow {
				display: flex;
				align-items: center;
				justify-content: space-between;
				margin-top: 8px;
			}
			.li-totalrow .tl {
				font-weight: 700;
				font-size: 15px;
				color: var(--text);
			}
			.li-totalrow .tv {
				font-weight: 800;
				font-size: 15px;
				color: var(--dark);
			}
			.v-ex-desc {
				margin-top: 16px;
				font-weight: 400;
				font-size: 13px;
				color: var(--muted);
				line-height: 1.7;
				text-align: right;
			}

			.pagination {
				display: flex;
				align-items: center;
				justify-content: flex-end;
				gap: 8px;
				margin-top: 20px;
				flex-wrap: wrap;
			}
			.pg-info {
				font-weight: 400;
				font-size: 13px;
				color: var(--muted);
				margin-right: 8px;
			}
			.pg-btn {
				height: 30px;
				padding: 0 14px;
				border: 1px solid var(--border);
				background: #fff;
				border-radius: 6px;
				cursor: pointer;
				font-family:
					'Montserrat', sans-serif;
				font-weight: 500;
				font-size: 13px;
				color: var(--muted);
				transition: 0.2s;
			}
			.pg-btn:hover:not(.active) {
				border-color: var(--blue);
				color: var(--blue);
			}
			.pg-btn.active {
				background: var(--grad);
				border-color: transparent;
				color: #fff;
			}
		</style>

		<script>
			window.ACTIVE_KEY = 'retail';
			window.SELECTED_IDX = 2;
		</script>
		<script src="shell.js"></script>
		<script>
			/* ====================== ORDERS ====================== */
			const SP_PENDING = [
				{ n: 1, pending: 32 },
				{ n: 2, pending: 21 },
				{ n: 3, pending: 44 },
				{ n: 4, pending: 18 },
				{ n: 5, pending: 27 },
			];

			const STATUS_LABEL = {
				ongoing: 'Ongoing',
				pending: 'Pending',
				finished: 'Finished',
			};
			const STORES = [
				'TB. Makmur Jaya',
				'TB. Sinar Abadi',
				'TB. Berkah Mandiri',
				'TB. Cahaya Baru',
				'TB. Sumber Rezeki',
				'TB. Harapan Kita',
				'TB. Subur Makmur',
				'TB. Sentosa Jaya',
			];
			const ADDR = [
				'JL. Dipati Unus 25, Cibodas, Tangerang, Banten, 11254',
				'JL. Daan Mogot 88, Batuceper, Tangerang, Banten, 15122',
				'JL. KH. Hasyim 14, Karawaci, Tangerang, Banten, 15810',
				'JL. Imam Bonjol 7, Cikokol, Tangerang, Banten, 15117',
			];
			const STATUSES = [
				'ongoing',
				'pending',
				'finished',
				'ongoing',
				'finished',
			];
			const SUBSTATUS = {
				pending: [
					'Waiting for Pricing Approval',
					'Waiting for Finance Approval',
					'Approved',
				],
				ongoing: [
					'Submitted to Warehouse',
					'Out for Delivery',
				],
				finished: ['Finished'],
			};
			const PRODNAMES = [
				'Rockwool RW80',
				'Glasswool GW24',
				'PU Panel 50mm',
				'Cement Board 9mm',
				'Acoustic Tile',
			];
			const DESC =
				'Catatan pesanan: pengiriman dijadwalkan sesuai tanggal delivery dengan koordinasi gudang. Pembayaran mengikuti T.O.P yang disepakati. Mohon konfirmasi ketersediaan stok sebelum proses packing dan pastikan dokumen surat jalan lengkap saat pengiriman ke lokasi toko.';

			function rupiah(n) {
				return (
					'Rp ' +
					n.toLocaleString('en-US')
				);
			}

			let ORDERS =
				[]; /* filled by loadOrders() from GET /retail/orders */

			const activeSP = new Set([
				1, 2, 3, 4, 5,
			]);
			let curStatus = 'all';
			let openRow = null;

			/* Warehouse fulfilment view: only approved-and-onward orders are shown */
			var WAREHOUSE_FULFILL = !!(
				window.DKI &&
				DKI.role &&
				DKI.role() === 'warehouse'
			);
			function fulfillable(o) {
				return (
					o.status === 'ongoing' ||
					o.status === 'finished' ||
					(o.status === 'pending' &&
						o.substatus === 'Approved')
				);
			}

			function applyFilters() {
				ORDERS.forEach(function (o) {
					const r =
						document.querySelector(
							'.v-rowwrap[data-id="' +
								o.id +
								'"]',
						);
					if (!r) return;
					const show =
						activeSP.has(o.sp) &&
						(curStatus === 'all' ||
							o.status === curStatus) &&
						(!WAREHOUSE_FULFILL ||
							fulfillable(o));
					const shown =
						r.style.display !== 'none';
					if (show && !shown) {
						r.style.display = '';
						gsap.fromTo(
							r,
							{ opacity: 0 },
							{
								opacity: 1,
								duration: 0.3,
							},
						);
					} else if (!show && shown) {
						gsap.to(r, {
							opacity: 0,
							duration: 0.3,
							onComplete: function () {
								r.style.display =
									'none';
							},
						});
					}
				});
			}

			/* ---- value summary (total / pending / target) ---- */
			const PENDING_STATUS = 'pending',
				VS_TITLE = 'Total Order Value',
				VS_PENDLABEL = 'Pending Value';
			const REALIZED_STATUS =
					'finished',
				VS_REALLABEL = 'Realized Value';
			let FULL_TOTAL = 0;
			let FULL_TARGET = 0;
			function renderValueSummary() {
				var act = ORDERS.filter(
					function (o) {
						return activeSP.has(o.sp);
					},
				);
				var total = act.reduce(
					function (s, o) {
						return s + o.value;
					},
					0,
				);
				var pending = act
					.filter(function (o) {
						return (
							o.status ===
							PENDING_STATUS
						);
					})
					.reduce(function (s, o) {
						return s + o.value;
					}, 0);
				var realized = act
					.filter(function (o) {
						return (
							o.status ===
							REALIZED_STATUS
						);
					})
					.reduce(function (s, o) {
						return s + o.value;
					}, 0);
				var target = Math.round(
					FULL_TARGET *
						(activeSP.size / 5),
				);
				var pct = target
					? Math.min(
							100,
							Math.round(
								(total / target) * 100,
							),
						)
					: 0;
				$('valSummary').innerHTML =
					'<div class="vs-head"><div><span class="vs-lbl">' +
					VS_TITLE +
					'</span><span class="vs-amt grad">' +
					rupiah(total) +
					'</span></div></div>' +
					'<div class="vs-track"><div class="vs-fill" style="width:' +
					pct +
					'%"></div></div>' +
					'<div class="vs-cap"><b>' +
					pct +
					'%</b> of target</div>' +
					'<div class="vs-subs">' +
					'<div class="vs-sub"><span class="dot pend"></span><span class="k">' +
					VS_PENDLABEL +
					'</span><span class="v">' +
					rupiah(pending) +
					'</span></div>' +
					'<div class="vs-sub"><span class="dot real"></span><span class="k">' +
					VS_REALLABEL +
					'</span><span class="v">' +
					rupiah(realized) +
					'</span></div>' +
					'<div class="vs-sub"><span class="dot tgt"></span><span class="k">Target</span><span class="v">' +
					rupiah(target) +
					'</span></div>' +
					'</div>';
			}

			/* ---- salesperson summary cards ---- */
			function renderSummary() {
				$('summaryRow').innerHTML =
					SP_PENDING.map(function (s) {
						return (
							'<div class="sum-card" data-sp="' +
							s.n +
							'">' +
							'<div class="sum-top"><div class="sum-avatar">S' +
							s.n +
							'</div><div class="sum-name">Sales ' +
							s.n +
							'</div></div>' +
							'<div class="sum-stat"><span class="k">Pending</span><span class="v">' +
							s.pending +
							'</span></div>' +
							'</div>'
						);
					}).join('');
				gsap.from(
					'#summaryRow .sum-card',
					{
						opacity: 0,
						y: 12,
						duration: 0.4,
						stagger: 0.06,
						ease: 'power2.out',
					},
				);
			}

			/* ---- salesperson filter ---- */
			function renderFilter() {
				$('spFilter').innerHTML = [
					1, 2, 3, 4, 5,
				]
					.map(function (n) {
						return (
							'<button class="sp-pill active" data-sp="' +
							n +
							'"><span class="dot"></span>Sales ' +
							n +
							'</button>'
						);
					})
					.join('');
				$('spFilter').addEventListener(
					'click',
					function (e) {
						const b =
							e.target.closest(
								'.sp-pill',
							);
						if (!b) return;
						const n = +b.dataset.sp;
						const on =
							b.classList.toggle(
								'active',
							);
						if (on) activeSP.add(n);
						else activeSP.delete(n);
						const card = $(
							'summaryRow',
						).querySelector(
							'.sum-card[data-sp="' +
								n +
								'"]',
						);
						if (card)
							collapseCard(card, on);
						renderValueSummary();
						applyFilters();
					},
				);
			}
			function collapseCard(
				card,
				show,
			) {
				gsap.killTweensOf(card);
				if (show) {
					card.style.display = '';
					card.style.flex = '0 0 auto';
					gsap.set(card, {
						width: 'auto',
						opacity: 1,
						paddingLeft: 16,
						paddingRight: 16,
					});
					const w = card.offsetWidth;
					gsap.fromTo(
						card,
						{
							width: 0,
							opacity: 0,
							paddingLeft: 0,
							paddingRight: 0,
						},
						{
							width: w,
							opacity: 1,
							paddingLeft: 16,
							paddingRight: 16,
							duration: 0.3,
							ease: 'power2.out',
							onComplete: function () {
								card.style.flex =
									'1 1 0';
								card.style.width = '';
							},
						},
					);
				} else {
					card.style.flex = '0 0 auto';
					const w = card.offsetWidth;
					gsap.fromTo(
						card,
						{ width: w, opacity: 1 },
						{
							width: 0,
							opacity: 0,
							paddingLeft: 0,
							paddingRight: 0,
							duration: 0.3,
							ease: 'power2.in',
							onComplete: function () {
								card.style.display =
									'none';
							},
						},
					);
				}
			}

			/* ---- status filter (radio) ---- */
			function renderStatusFilter() {
				const opts = [
					{ k: 'all', l: 'All' },
					{
						k: 'ongoing',
						l: 'Ongoing',
					},
					{
						k: 'pending',
						l: 'Pending',
					},
					{
						k: 'finished',
						l: 'Finished',
					},
				];
				$('statusFilter').innerHTML =
					opts
						.map(function (o) {
							return (
								'<button class="sf-pill' +
								(o.k === 'all'
									? ' active'
									: '') +
								'" data-status="' +
								o.k +
								'">' +
								o.l +
								'</button>'
							);
						})
						.join('');
				$(
					'statusFilter',
				).addEventListener(
					'click',
					function (e) {
						const b =
							e.target.closest(
								'.sf-pill',
							);
						if (!b) return;
						$('statusFilter')
							.querySelectorAll(
								'.sf-pill',
							)
							.forEach(function (x) {
								x.classList.remove(
									'active',
								);
							});
						b.classList.add('active');
						curStatus =
							b.dataset.status;
						applyFilters();
					},
				);
			}

			/* ---- orders table ---- */
			function renderTable() {
				$('orderTable').innerHTML =
					ORDERS.map(function (o) {
						return (
							'<div class="v-rowwrap" data-sp="' +
							o.sp +
							'" data-id="' +
							o.id +
							'">' +
							'<div class="v-row">' +
							'<div class="v-oid">' +
							o.id +
							'</div>' +
							'<div class="v-store">' +
							o.store +
							'</div>' +
							'<div class="v-date">' +
							o.date +
							'</div>' +
							'<div class="v-delivery">' +
							o.delivery +
							'</div>' +
							'<div class="v-value">' +
							rupiah(o.value) +
							'</div>' +
							'<div class="v-salesman">Sales ' +
							o.sp +
							'</div>' +
							'<div class="v-status ' +
							o.status +
							'">' +
							STATUS_LABEL[o.status] +
							'</div>' +
							'<div class="v-view">View</div>' +
							'</div>' +
							'<div class="v-expand" id="exp-' +
							o.id +
							'"></div>' +
							'</div>'
						);
					}).join('');
				$(
					'orderTable',
				).addEventListener(
					'click',
					function (e) {
						const wrap =
							e.target.closest(
								'.v-rowwrap',
							);
						if (!wrap) return;
						if (
							e.target.closest(
								'.v-expand',
							)
						)
							return;
						toggleExpand(
							wrap.dataset.id,
						);
					},
				);
			}
			function expandHTML(o) {
				const items = o.items
					.map(function (it) {
						return (
							'<div class="li-row"><div class="li-main"><div class="li-name">' +
							it.name +
							'</div>' +
							'<div class="li-unit">' +
							rupiah(it.unit) +
							' / pc</div></div>' +
							'<div class="li-qty">x' +
							it.qty +
							'</div>' +
							'<div class="li-total">' +
							rupiah(it.total) +
							'</div></div>'
						);
					})
					.join('');
				return (
					'<div class="v-expand-inner">' +
					'<div class="v-ex-left">' +
					'<div class="v-ex-id">#' +
					o.id +
					'</div>' +
					'<div class="v-ex-store">' +
					o.store +
					'</div>' +
					'<div class="v-ex-addrlabel">Delivery Address</div>' +
					'<div class="v-ex-addr">' +
					o.addr +
					'</div>' +
					'<div class="v-ex-meta">Sales ' +
					o.sp +
					'<br>Date added: ' +
					o.dateAdded +
					'<br>Delivery Date: ' +
					o.deliveryFull +
					'<br>T.O.P: ' +
					o.top +
					'</div>' +
					'<div class="v-ex-pill ' +
					o.status +
					'"><span class="pdot"></span>' +
					STATUS_LABEL[o.status] +
					'</div>' +
					'<div class="v-ex-substatus"><span class="sk">Status Detail</span><span class="sv ' +
					o.status +
					'">' +
					o.substatus +
					'</span></div>' +
					'</div>' +
					'<div class="v-ex-right">' +
					items +
					'<div class="li-totalrow"><span class="tl">Total</span><span class="tv">' +
					rupiah(o.total) +
					'</span></div>' +
					'<div class="v-ex-desc">' +
					DESC +
					'</div>' +
					'</div>' +
					'</div>'
				);
			}
			function toggleExpand(id) {
				if (openRow === id) {
					closeExpand(id);
					openRow = null;
					return;
				}
				if (openRow !== null)
					closeExpand(openRow);
				const wrap =
					document.querySelector(
						'.v-rowwrap[data-id="' +
							id +
							'"]',
					);
				wrap.classList.add('open');
				const panel =
					document.getElementById(
						'exp-' + id,
					);
				const o = ORDERS.find(
					function (x) {
						return x.id === id;
					},
				);
				panel.innerHTML = expandHTML(o);
				gsap.set(panel, {
					height: 'auto',
				});
				const h = panel.offsetHeight;
				gsap.fromTo(
					panel,
					{ height: 0, opacity: 0 },
					{
						height: h,
						opacity: 1,
						duration: 0.4,
						ease: 'power2.out',
						onComplete: function () {
							gsap.set(panel, {
								height: 'auto',
							});
						},
					},
				);
				openRow = id;
			}
			function closeExpand(id) {
				const wrap =
					document.querySelector(
						'.v-rowwrap[data-id="' +
							id +
							'"]',
					);
				if (wrap)
					wrap.classList.remove('open');
				const panel =
					document.getElementById(
						'exp-' + id,
					);
				gsap.to(panel, {
					height: 0,
					opacity: 0,
					duration: 0.3,
					ease: 'power2.in',
					onComplete: function () {
						panel.innerHTML = '';
					},
				});
			}

			/* ---- date range pills ---- */
			document
				.querySelectorAll('.date-pill')
				.forEach(function (p) {
					const input =
						p.dataset.target === 'start'
							? $('dateStart')
							: $('dateEnd');
					p.addEventListener(
						'click',
						function () {
							if (input.showPicker) {
								try {
									input.showPicker();
								} catch (err) {
									input.focus();
								}
							} else input.focus();
						},
					);
					input.addEventListener(
						'change',
						function () {
							if (!input.value) return;
							const d = new Date(
								input.value,
							);
							const mm = String(
								d.getMonth() + 1,
							).padStart(2, '0');
							const dd = String(
								d.getDate(),
							).padStart(2, '0');
							p.textContent =
								mm + '/' + dd;
						},
					);
				});

			/* ---- monthly / weekly ---- */
			$('mwToggle').addEventListener(
				'click',
				function (e) {
					const b =
						e.target.closest('button');
					if (!b) return;
					$('mwToggle')
						.querySelectorAll('button')
						.forEach(function (x) {
							x.classList.remove(
								'active',
							);
						});
					b.classList.add('active');
				},
			);

			/* ---- view per page ---- */
			const PP = [10, 25, 50];
			let ppIdx = 0;
			$('perPage').addEventListener(
				'click',
				function () {
					ppIdx =
						(ppIdx + 1) % PP.length;
					$('perPage').textContent =
						PP[ppIdx];
					curPage = 1;
					renderPagination();
				},
			);

			/* ---- pagination ---- */
			const TOTAL = 150;
			let curPage = 1;
			function renderPagination() {
				const per = PP[ppIdx];
				const pages = Math.ceil(
					TOTAL / per,
				);
				if (curPage > pages)
					curPage = pages;
				const start =
					(curPage - 1) * per + 1;
				const end = Math.min(
					curPage * per,
					TOTAL,
				);
				let h =
					'<span class="pg-info">Showing ' +
					start +
					'-' +
					end +
					' of ' +
					TOTAL +
					'</span>';
				h +=
					'<button class="pg-btn" data-pg="prev">Prev</button>';
				for (
					let i = 1;
					i <= pages;
					i++
				) {
					h +=
						'<button class="pg-btn' +
						(i === curPage
							? ' active'
							: '') +
						'" data-pg="' +
						i +
						'">' +
						i +
						'</button>';
				}
				h +=
					'<button class="pg-btn" data-pg="next">Next</button>';
				$('pagination').innerHTML = h;
			}
			$('pagination').addEventListener(
				'click',
				function (e) {
					const b =
						e.target.closest('.pg-btn');
					if (!b) return;
					const per = PP[ppIdx];
					const pages = Math.ceil(
						TOTAL / per,
					);
					const v = b.dataset.pg;
					if (v === 'prev')
						curPage = Math.max(
							1,
							curPage - 1,
						);
					else if (v === 'next')
						curPage = Math.min(
							pages,
							curPage + 1,
						);
					else curPage = +v;
					renderPagination();
				},
			);

			/* ---- init + entrance ---- */
			renderFilter();
			renderStatusFilter();

			async function loadOrders() {
				try {
					const d =
						await API.getOrders('all');
					ORDERS = d.rows;
				} catch (err) {
					console.error(
						'Failed to load orders:',
						err,
					);
					ORDERS = [];
				}
				FULL_TOTAL = ORDERS.reduce(
					function (s, o) {
						return s + o.value;
					},
					0,
				);
				FULL_TARGET =
					Math.ceil(
						(FULL_TOTAL * 1.25) / 1e7,
					) * 1e7;
				renderSummary();
				renderValueSummary();
				renderTable();
				renderPagination();
			}
			loadOrders();
			if (WAREHOUSE_FULFILL) {
				document.body.setAttribute(
					'data-fulfill',
					'1',
				);
				var _fs =
					document.createElement(
						'style',
					);
				_fs.textContent =
					'body[data-fulfill="1"] .valsummary,body[data-fulfill="1"] #valSummary,body[data-fulfill="1"] .summary-row,body[data-fulfill="1"] #spFilter,body[data-fulfill="1"] .v-value,body[data-fulfill="1"] .li-unit,body[data-fulfill="1"] .li-total,body[data-fulfill="1"] .li-totalrow{display:none !important;}' +
					'body[data-fulfill="1"] .statusfilter{margin-top:16px;}';
				document.head.appendChild(_fs);
				document
					.querySelectorAll(
						'.welcome h1',
					)
					.forEach(function (h) {
						h.textContent =
							'Fulfill Orders';
					});
				[].slice
					.call(
						document.querySelectorAll(
							'button,a',
						),
					)
					.forEach(function (b) {
						if (
							/Buat Order/i.test(
								b.textContent || '',
							)
						)
							b.style.display = 'none';
					});
				applyFilters();
				if (window.gsap) {
					try {
						gsap.globalTimeline.progress(
							1,
						);
					} catch (e) {}
				}
			}
			gsap.from(
				'.main > .welcome, .export-row, .vcard',
				{
					opacity: 0,
					y: 16,
					duration: 0.5,
					stagger: 0.06,
					ease: 'power2.out',
				},
			);
		</script>
		<script>
			/* access-level: Staff sees only their own records (group totals stay visible) */
			(function () {
				if (!window.DKI) return;
				var s = DKI.getSession();
				if (!s) return;
				document.body.setAttribute(
					'data-role',
					s.role,
				);
				if (s.level)
					document.body.setAttribute(
						'data-level',
						s.level,
					);
				var own = DKI.ownerSP();
				if (!own) return; // supervisor / manager / superadmin: see all
				var idx = parseInt(
					String(own).replace(
						/\D/g,
						'',
					),
					10,
				);
				try {
					if (
						typeof activeSP !==
							'undefined' &&
						activeSP &&
						activeSP.clear
					) {
						activeSP.clear();
						activeSP.add(idx);
					}
					var f =
						document.getElementById(
							'spFilter',
						);
					if (f)
						f.style.display = 'none';
					document
						.querySelectorAll(
							'.summary-row',
						)
						.forEach(function (el) {
							el.style.display = 'none';
							var nx =
								el.nextElementSibling;
							while (
								nx &&
								getComputedStyle(nx)
									.display === 'none'
							)
								nx =
									nx.nextElementSibling;
							if (
								nx &&
								!nx.style.marginTop
							)
								nx.style.marginTop =
									'16px';
						});
					if (
						typeof applyFilters ===
						'function'
					) {
						applyFilters();
						if (window.gsap) {
							try {
								gsap.globalTimeline.progress(
									1,
								);
							} catch (e) {}
						}
					}
					if (
						typeof renderValueSummary ===
						'function'
					)
						renderValueSummary();
					if (
						typeof renderSummary ===
						'function'
					)
						renderSummary();
				} catch (e) {
					console.warn(
						'staff-lock skipped',
						e,
					);
				}
			})();
		</script>
	</body>
</html>
