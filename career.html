<!doctype html>
<html lang="id">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>DKI ERP — Career</title>
		<link
			rel="preconnect"
			href="https://fonts.googleapis.com"
		/>
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&display=swap"
			rel="stylesheet"
		/>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
		<link
			rel="stylesheet"
			href="shell.css"
		/>
		<script src="auth.js"></script>
	</head>
	<body>
		<!-- ====================== SIDEBAR ====================== -->
		<aside class="sidebar" id="sidebar">
			<div class="sidebar-logo">
				<img
					class="logo-img"
					src="assets/Logo_DKI.png"
					alt="PT Duta Kencana Indah"
				/>
			</div>

			<nav class="nav" id="nav"></nav>

			<div class="sidebar-bottom">
				<div class="user-row">
					<div class="avatar">R</div>
					<div class="user-meta">
						<div class="nm">Rayvin</div>
						<div class="rl">
							Superadmin
						</div>
					</div>
				</div>
				<a
					class="logout-row"
					href="index.html"
					title="Log Out"
				>
					<svg
						class="ic"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
					>
						<path
							d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"
						/>
						<polyline
							points="16 17 21 12 16 7"
						/>
						<line
							x1="21"
							y1="12"
							x2="9"
							y2="12"
						/>
					</svg>
					<span class="label"
						>LOG OUT</span
					>
				</a>
			</div>
		</aside>

		<!-- ====================== HEADER ====================== -->
		<header class="header">
			<button
				class="collapse-toggle"
				id="collapseToggle"
			>
				«
			</button>
			<div
				class="breadcrumb"
				id="breadcrumb"
			></div>
			<div class="company">
				PT. DUTA KENCANA INDAH
			</div>
		</header>

		<!-- ====================== MAIN ====================== -->
		<main class="main">
			<div class="welcome">
				<div>
					<h1>Career</h1>
					<div class="date">
						09 Jun 2026
					</div>
				</div>
				<div class="sub-actions">
					<button class="btn">
						<svg
							width="16"
							height="16"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2.2"
							stroke-linecap="round"
						>
							<path
								d="M12 5v14M5 12h14"
							/></svg
						>Buka Lowongan
					</button>
				</div>
			</div>
			<section class="vcard">
				<div class="toolbar">
					<div class="search">
						<svg
							width="16"
							height="16"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
						>
							<circle
								cx="11"
								cy="11"
								r="7"
							/>
							<path
								d="m21 21-4.3-4.3"
							/></svg
						><input
							placeholder="Cari posisi..."
						/>
					</div>
					<div class="spacer"></div>
					<span class="pill-note"
						>Pelamar masuk ke HRGA ›
						Pelamar</span
					>
				</div>
				<table class="dtable">
					<thead>
						<tr>
							<th>Posisi</th>
							<th>Departemen</th>
							<th>Tipe</th>
							<th>Lokasi</th>
							<th class="t-right">
								Pelamar
							</th>
							<th>Status</th>
							<th></th>
						</tr>
					</thead>
					<tbody id="carBody"></tbody>
				</table>
			</section>
		</main>

		<style>
			/* ===== export buttons ===== */
			.export-row {
				display: flex;
				justify-content: flex-end;
				gap: 10px;
				margin: -8px 0 16px;
			}
			.btn-export,
			.btn-excel {
				height: 34px;
				padding: 0 20px;
				border: none;
				border-radius: 8px;
				cursor: pointer;
				font-family:
					'Montserrat', sans-serif;
				font-weight: 700;
				font-size: 13px;
				color: #fff;
				transition: filter 0.2s ease;
			}
			.btn-export {
				background: var(--grad);
			}
			.btn-excel {
				background: #27ae60;
			}
			.btn-export:hover,
			.btn-excel:hover {
				filter: brightness(1.08);
			}

			/* ===== main card ===== */
			.vcard {
				background: var(--card);
				border: 1px solid var(--border);
				border-radius: 12px;
				padding: 24px 28px;
				box-shadow: 0 2px 8px
					rgba(0, 0, 0, 0.04);
			}
			.controls-row {
				display: flex;
				align-items: center;
				gap: 16px;
				flex-wrap: wrap;
			}
			.vcard-title {
				margin: 0;
				font-weight: 700;
				font-size: 16px;
				color: var(--text);
			}
			.custom-label {
				font-weight: 500;
				font-size: 14px;
				color: var(--muted);
			}
			.daterange {
				display: flex;
				align-items: center;
				gap: 8px;
				position: relative;
			}
			.date-pill {
				height: 30px;
				padding: 0 14px;
				border: none;
				border-radius: 100px;
				cursor: pointer;
				background: var(--grad);
				color: #fff;
				font-family:
					'Montserrat', sans-serif;
				font-weight: 600;
				font-size: 13px;
			}
			.daterange .dash {
				color: var(--muted);
			}
			.date-native {
				position: absolute;
				left: 0;
				bottom: 0;
				width: 1px;
				height: 1px;
				opacity: 0;
				pointer-events: none;
			}
			.mw-toggle {
				margin-left: auto;
				display: flex;
				gap: 6px;
			}
			.mw-toggle button {
				height: 30px;
				padding: 0 16px;
				border-radius: 100px;
				border: none;
				cursor: pointer;
				font-family:
					'Montserrat', sans-serif;
				font-weight: 600;
				font-size: 13px;
				background: var(--bg);
				color: var(--muted);
				transition: 0.2s;
			}
			.mw-toggle button.active {
				background: var(--grad);
				color: #fff;
			}

			.filter2-row {
				display: flex;
				align-items: center;
				gap: 16px;
				margin-top: 14px;
				flex-wrap: wrap;
			}
			.sp-filter {
				display: flex;
				gap: 8px;
				flex-wrap: wrap;
			}
			.sp-pill {
				display: flex;
				align-items: center;
				gap: 7px;
				height: 30px;
				padding: 0 14px;
				border-radius: 100px;
				cursor: pointer;
				font-family:
					'Montserrat', sans-serif;
				font-weight: 600;
				font-size: 13px;
				background: #fff;
				border: 1px solid var(--border);
				color: var(--muted);
				transition: 0.2s;
				white-space: nowrap;
			}
			.sp-pill .dot {
				width: 7px;
				height: 7px;
				border-radius: 50%;
				background: var(--muted);
				flex: 0 0 auto;
			}
			.sp-pill.active {
				background: var(--grad);
				border-color: transparent;
				color: #fff;
			}
			.sp-pill.active .dot {
				background: #fff;
			}
			.perpage {
				margin-left: auto;
				display: flex;
				align-items: center;
				gap: 10px;
			}
			.pp-label {
				font-weight: 500;
				font-size: 13px;
				color: var(--muted);
			}
			.pp-pill {
				height: 30px;
				padding: 0 14px;
				border: none;
				border-radius: 8px;
				cursor: pointer;
				background: var(--grad);
				color: #fff;
				font-family:
					'Montserrat', sans-serif;
				font-weight: 700;
				font-size: 13px;
			}

			/* salesperson summary cards (Pending) */
			.summary-row {
				display: flex;
				gap: 12px;
				margin-top: 16px;
				margin-bottom: 16px;
				align-items: stretch;
			}
			.sum-card {
				flex: 1 1 0;
				min-width: 0;
				background: #f8fbff;
				border: 1px solid var(--border);
				border-radius: 10px;
				padding: 14px 16px;
				overflow: hidden;
			}
			.sum-top {
				display: flex;
				align-items: center;
				gap: 10px;
				margin-bottom: 10px;
				flex-wrap: wrap;
			}
			.sum-avatar {
				flex: 0 0 40px;
				width: 40px;
				height: 40px;
				border-radius: 50%;
				background: var(--grad);
				display: flex;
				align-items: center;
				justify-content: center;
				color: #fff;
				font-weight: 700;
				font-size: 13px;
			}
			.sum-name {
				font-weight: 600;
				font-size: 14px;
				color: var(--dark);
				white-space: nowrap;
			}
			.sum-stat {
				display: flex;
				align-items: baseline;
				justify-content: space-between;
				gap: 8px;
			}
			.sum-stat .k {
				font-weight: 400;
				font-size: 12px;
				color: var(--muted);
				white-space: nowrap;
			}
			.sum-stat .v {
				font-weight: 700;
				font-size: 16px;
				color: var(--red);
			}

			/* status filter (radio) */
			.statusfilter {
				display: flex;
				gap: 10px;
				margin-bottom: 20px;
				flex-wrap: wrap;
			}
			.sf-pill {
				height: 34px;
				padding: 0 18px;
				border: none;
				border-radius: 100px;
				cursor: pointer;
				font-family:
					'Montserrat', sans-serif;
				font-weight: 600;
				font-size: 13px;
				background: var(--bg);
				color: var(--muted);
				transition:
					background 0.2s ease,
					color 0.2s ease;
			}
			.sf-pill.active {
				color: #fff;
			}
			.sf-pill.active[data-status='all'] {
				background: var(--grad);
			}
			.sf-pill.active[data-status='outstanding'] {
				background: #1ca7ec;
			}
			.sf-pill.active[data-status='due2w'] {
				background: #f5a623;
			}
			.sf-pill.active[data-status='overdue'] {
				background: #fe2c23;
			}
			.sf-pill.active[data-status='paid'] {
				background: #27ae60;
			}

			.divider {
				height: 1px;
				background: var(--border);
				width: 100%;
			}

			/* value summary (total / processing / target) */
			.valsummary {
				background: #f8fbff;
				border: 1px solid var(--border);
				border-radius: 12px;
				padding: 18px 22px;
				margin: 16px 0 18px;
			}
			.vs-head {
				display: flex;
				align-items: flex-end;
				justify-content: space-between;
				gap: 16px;
				flex-wrap: wrap;
			}
			.vs-lbl {
				display: block;
				font-weight: 600;
				font-size: 12px;
				color: var(--muted);
				text-transform: uppercase;
				letter-spacing: 0.05em;
				margin-bottom: 5px;
			}
			.vs-amt {
				font-weight: 800;
				font-size: 28px;
				line-height: 1;
			}
			.vs-amt.grad {
				background: var(--grad);
				-webkit-background-clip: text;
				background-clip: text;
				color: transparent;
			}
			.vs-track {
				height: 14px;
				border-radius: 8px;
				background: var(--bg);
				overflow: hidden;
				margin: 16px 0 7px;
			}
			.vs-fill {
				height: 100%;
				border-radius: 8px;
				background: var(--grad);
				transition: width 0.55s ease;
			}
			.vs-cap {
				font-weight: 500;
				font-size: 12px;
				color: var(--muted);
			}
			.vs-cap b {
				font-weight: 800;
				color: var(--dark);
			}
			.vs-subs {
				display: flex;
				gap: 30px;
				margin-top: 14px;
				flex-wrap: wrap;
			}
			.vs-sub {
				display: flex;
				align-items: center;
				gap: 9px;
			}
			.vs-sub .dot {
				width: 9px;
				height: 9px;
				border-radius: 50%;
				flex: 0 0 auto;
			}
			.vs-sub .dot.pend {
				background: #f5a623;
			}
			.vs-sub .dot.real {
				background: #27ae60;
			}
			.vs-sub .dot.tgt {
				background: var(--dark);
			}
			.vs-sub .k {
				font-weight: 500;
				font-size: 12px;
				color: var(--muted);
			}
			.vs-sub .v {
				font-weight: 700;
				font-size: 15px;
				color: var(--text);
			}

			/* purchase orders table */
			.visit-table {
				margin-top: 4px;
			}
			.v-rowwrap {
				border-bottom: 1px solid #f4f6f9;
			}
			.v-row {
				display: flex;
				align-items: center;
				gap: 16px;
				padding: 12px 8px;
				cursor: pointer;
				transition: background 0.2s ease;
				border-radius: 8px;
			}
			.v-row:hover {
				background: #f8fbff;
			}
			.v-oid {
				font-weight: 700;
				font-size: 14px;
				color: var(--dark);
				min-width: 100px;
			}
			.v-store {
				font-weight: 500;
				font-size: 13px;
				color: var(--text);
				flex: 1.5;
				min-width: 150px;
				display: flex;
				flex-direction: column;
				gap: 2px;
				overflow: hidden;
			}
			.v-store .vs-co {
				font-weight: 600;
				font-size: 13.5px;
				color: var(--text);
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			.v-store .vs-proj {
				font-weight: 400;
				font-size: 12px;
				color: var(--muted);
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			.v-date {
				font-weight: 400;
				font-size: 13px;
				color: var(--muted);
				min-width: 80px;
			}
			.v-delivery {
				font-weight: 400;
				font-size: 13px;
				color: var(--muted);
				min-width: 100px;
			}
			.v-value {
				font-weight: 600;
				font-size: 13px;
				color: var(--text);
				min-width: 100px;
			}
			.v-salesman {
				font-weight: 400;
				font-size: 13px;
				color: var(--muted);
				min-width: 80px;
			}
			.v-status {
				font-weight: 600;
				font-size: 13px;
				min-width: 70px;
			}
			.v-status.outstanding {
				color: #1ca7ec;
			}
			.v-status.due2w {
				color: #f5a623;
			}
			.v-status.overdue {
				color: #fe2c23;
			}
			.v-status.paid {
				color: #27ae60;
			}
			.v-view {
				font-weight: 600;
				font-size: 13px;
				color: var(--blue);
				cursor: pointer;
				min-width: 40px;
				text-align: right;
			}
			.v-view:hover {
				text-decoration: underline;
			}
			.v-rowwrap.open .v-oid,
			.v-rowwrap.open .v-store .vs-co,
			.v-rowwrap.open .v-view {
				background: var(--grad);
				-webkit-background-clip: text;
				background-clip: text;
				color: transparent;
			}
			@media (max-width: 1320px) {
				.v-delivery {
					display: none;
				}
			}
			@media (max-width: 1120px) {
				.v-date {
					display: none;
				}
			}
			@media (max-width: 960px) {
				.v-salesman {
					display: none;
				}
			}

			/* expanded panel */
			.v-expand {
				overflow: hidden;
				height: 0;
				opacity: 0;
			}
			.v-expand-inner {
				background: #f8fbff;
				border: 1px solid var(--border);
				border-top: none;
				border-radius: 0 0 12px 12px;
				padding: 24px 28px;
				display: flex;
				gap: 32px;
			}
			.v-ex-left {
				flex: 0 0 45%;
			}
			.v-ex-id {
				font-weight: 800;
				font-size: 22px;
				color: var(--dark);
				margin-bottom: 12px;
			}
			.v-ex-store {
				font-weight: 700;
				font-size: 16px;
				color: var(--text);
			}
			.v-ex-addrlabel {
				font-weight: 500;
				font-style: italic;
				font-size: 13px;
				color: var(--muted);
				margin-top: 4px;
			}
			.v-ex-addr {
				font-weight: 400;
				font-size: 13px;
				color: var(--text);
				line-height: 1.6;
				margin-bottom: 16px;
			}
			.v-ex-meta {
				font-weight: 400;
				font-size: 13px;
				color: var(--text);
				line-height: 1.9;
			}
			.v-ex-pill {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				margin-top: 12px;
				padding: 6px 20px;
				border-radius: 100px;
				color: #fff;
				font-weight: 700;
				font-size: 13px;
			}
			.v-ex-pill .pdot {
				width: 8px;
				height: 8px;
				border-radius: 50%;
				background: rgba(0, 0, 0, 0.28);
			}
			.v-ex-pill.outstanding {
				background: #1ca7ec;
			}
			.v-ex-pill.due2w {
				background: #f5a623;
			}
			.v-ex-pill.overdue {
				background: #fe2c23;
			}
			.v-ex-pill.paid {
				background: #27ae60;
			}
			.v-ex-substatus {
				display: flex;
				flex-direction: column;
				gap: 2px;
				margin-top: 12px;
			}
			.v-ex-substatus .sk {
				font-weight: 500;
				font-size: 12px;
				color: var(--muted);
				text-transform: uppercase;
				letter-spacing: 0.06em;
			}
			.v-ex-substatus .sv {
				font-weight: 700;
				font-size: 14px;
			}
			.v-ex-substatus .sv.outstanding {
				color: #1ca7ec;
			}
			.v-ex-substatus .sv.due2w {
				color: #f5a623;
			}
			.v-ex-substatus .sv.overdue {
				color: #fe2c23;
			}
			.v-ex-substatus .sv.paid {
				color: #27ae60;
			}
			/* Tanda Terima tracker (PO rows only) */
			.tt-block {
				margin-top: 18px;
				border-top: 1px solid
					var(--border);
				padding-top: 14px;
			}
			.tt-title {
				font-weight: 600;
				font-size: 12px;
				color: var(--muted);
				text-transform: uppercase;
				letter-spacing: 0.06em;
				margin-bottom: 10px;
			}
			.tt-step {
				display: flex;
				align-items: center;
				gap: 11px;
				padding: 6px 0;
			}
			.tt-dot {
				width: 13px;
				height: 13px;
				border-radius: 50%;
				flex: 0 0 auto;
				border: 2px solid #e0e0e0;
				background: #fff;
			}
			.tt-step.done .tt-dot {
				background: var(--grad);
				border-color: transparent;
			}
			.tt-step.pending .tt-dot {
				background: #fff;
				border-color: #e0e0e0;
			}
			.tt-label {
				font-weight: 600;
				font-size: 13px;
				color: var(--text);
				flex: 1;
			}
			.tt-step.pending .tt-label {
				color: var(--muted);
			}
			.tt-step.done .tt-label {
				color: var(--dark);
			}
			.tt-date {
				font-weight: 500;
				font-size: 12px;
				color: var(--muted);
			}
			.tt-step.done .tt-date {
				color: var(--blue);

			).join('');
